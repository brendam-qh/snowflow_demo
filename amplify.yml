version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # Vite 8 requires Node ^20.19 || >=22.12 — pin so the build image's
            # default runtime can't silently drop us onto an older major.
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # Static Vite output — no SSR runtime, no env vars. Everything the demo
        # renders is generated on the GPU at load time, so there are no assets
        # to ship beyond the bundle itself.
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    appRoot: snowflow_demo-main
